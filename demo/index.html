<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>观易 Open Kit</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eceaf5;background:#0d1020}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#29305d,#0d1020 58%)}main{max-width:760px;margin:auto;padding:64px 20px}h1{font-size:clamp(2.4rem,8vw,5rem);margin:0}.lead{color:#b9bed6;font-size:1.15rem;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:36px}.card{padding:22px;border:1px solid #ffffff24;border-radius:20px;background:#ffffff0c;backdrop-filter:blur(14px)}button{border:0;border-radius:999px;padding:12px 18px;background:#dbd5ff;color:#17152b;font-weight:700;cursor:pointer}.result{margin-top:14px;color:#d7dbec;line-height:1.6}.note{margin-top:32px;color:#8f96b5;font-size:.86rem}
  </style>
</head>
<body><main><p>PRIVACY-FIRST · OPEN SOURCE</p><h1>观易 Open Kit</h1><p class="lead">把传统文化转译为节律、空间和自我观察工具。默认本地运行，不收集个人资料，不提供确定性预测。</p><section class="grid"><article class="card"><h2>今日节律</h2><button id="rhythm">生成观察提示</button><div id="rhythm-result" class="result"></div></article><article class="card"><h2>空间观察</h2><button id="space">查看基础清单</button><div id="space-result" class="result"></div></article></section><p class="note">文化体验工具，不构成医疗、法律、投资或命运判断。</p></main><script type="module" src="./main.js"></script></body>
</html>
